# Builds the Concordance web image (concordance-web/) and pushes it to the GitHub
# Container Registry:
#
#   ghcr.io/<owner>/concordance-web:latest            the newest build from main
#   ghcr.io/<owner>/concordance-web:web-X.Y.Z         Concordance web X.Y.Z (app/version.py)
#   ghcr.io/<owner>/concordance-web:concordance-X.Y.Z    built with Concordance X.Y.Z's code
#   ghcr.io/<owner>/concordance-web:sha-<commit>      every build
#
# Runs on pushes to main that change the web app or the plugin modules it
# imports with, and by hand (Actions → Concordance web image → Run workflow).
# Pull requests build and smoke-test the image without pushing it.
#
# The image is tested (concordance-web/tests/smoke.sh: sample data, every page)
# before anything is pushed, and built for amd64 and arm64.
#
# No git tags are made: release.yml treats tags named <name>-vX.Y.Z as plugin
# releases.
name: Concordance web image

on:
  push:
    branches: [main]
    paths:
      - "concordance-web/**"
      - "concordance.koplugin/concordance/**"
      - "concordance.koplugin/_meta.lua"
      - ".github/workflows/web-image.yml"
  pull_request:
    paths:
      - "concordance-web/**"
      - "concordance.koplugin/concordance/**"
      - ".github/workflows/web-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: web-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/concordance-web

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Concordance version
        id: version
        run: |
          v=$(sed -n 's/^ *version = "\([0-9][0-9.]*\)".*/\1/p' concordance.koplugin/_meta.lua)
          test -n "$v"
          echo "concordance=$v" >> "$GITHUB_OUTPUT"
          w=$(sed -n 's/^VERSION = "\([0-9][0-9.]*\)".*/\1/p' concordance-web/app/version.py)
          test -n "$w"
          echo "web=$w" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=web-${{ steps.version.outputs.web }},enable={{is_default_branch}}
            type=raw,value=concordance-${{ steps.version.outputs.concordance }},enable={{is_default_branch}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Concordance web
            org.opencontainers.image.version=${{ steps.version.outputs.web }}
            org.opencontainers.image.description=Browse the books, highlights and reading statistics Concordance keeps on a WebDAV server

      - name: Build for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: concordance-web/Dockerfile
          platforms: linux/amd64
          load: true
          tags: concordance-web:test
          cache-from: type=gha,scope=web-image
          cache-to: type=gha,scope=web-image,mode=max

      - name: Smoke test
        run: concordance-web/tests/smoke.sh concordance-web:test

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: concordance-web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web-image
          cache-to: type=gha,scope=web-image,mode=max
