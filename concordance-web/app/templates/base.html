<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Concordance{% endblock %} · Concordance</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
<script>
  try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="/">
      <svg width="22" height="22" viewBox="10 10 44 44" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="5"><path d="M34.91 25.24A12 12 0 1 1 28.24 20.45"/><path d="M29.09 38.76A12 12 0 1 1 35.76 43.55"/></g></svg>
      Concordance
    </a>
    {% set path = request.url.path %}
    <nav aria-label="Main">
      <a href="/" {% if path == '/' %}aria-current="page"{% endif %}>Home</a>
      <a href="/books" {% if path.startswith('/book') or path in ('/authors', '/series', '/tags') %}aria-current="page"{% endif %}>Books</a>
      <a href="/highlights" {% if path.startswith('/highlights') %}aria-current="page"{% endif %}>Highlights</a>
      <a href="/stats" {% if path.startswith('/stats') or path.startswith('/day') %}aria-current="page"{% endif %}>Statistics</a>
      <a href="/collections" {% if path.startswith('/collections') %}aria-current="page"{% endif %}>Collections</a>
    </nav>
    <form class="search" action="/highlights" role="search">
      <input type="search" name="q" placeholder="Search highlights" aria-label="Search highlights" value="{{ q if q is defined and path.startswith('/highlights') else '' }}">
    </form>
    <div class="top-end">
      <a class="sync-dot {% if syncer.state.last_error %}err{% elif syncer.state.running %}busy{% endif %}" href="/status"
         title="{% if syncer.state.last_error %}Import problem: see Status{% elif syncer.state.last_finished %}Last checked {{ syncer.state.last_finished | when }}{% else %}Importing…{% endif %}">
        <span aria-hidden="true"></span>Status</a>
      <a class="settings-link" href="/settings" {% if path.startswith('/settings') %}aria-current="page"{% endif %}>Settings</a>
      <button class="theme" type="button" aria-label="Switch light or dark theme" data-theme-toggle>
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>
</header>
<main class="page">
{% block content %}{% endblock %}
</main>
<footer class="foot small muted">Concordance web {{ VERSION }}{% if CONCORDANCE_VERSION %} · Concordance {{ CONCORDANCE_VERSION }}{% endif %}</footer>
<div class="tip" role="status" aria-live="polite" hidden></div>
</body>
</html>
